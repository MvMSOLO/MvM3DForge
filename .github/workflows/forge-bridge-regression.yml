name: Forge bridge regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  forge-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app in development mode and generate typed route tree
        run: npm run build:dev

      - name: Type-check project
        run: npm run typecheck

      - name: Run full automated test suite
        run: npm test

      - name: Lint project
        run: npm run lint
