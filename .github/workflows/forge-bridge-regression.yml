name: Forge bridge regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  forge-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app in development mode and generate typed route tree
        run: npm run build:dev

      - name: Type-check project
        run: npm run typecheck

      - name: Run MCP, auth and scene regression tests
        run: node --experimental-strip-types --test src/lib/auth/mcp-auth-policy.test.ts src/lib/mcp/api-keys.test.ts src/forge/sdk/execute.test.ts src/forge/ai-mcp.test.ts src/forge/export-glb.test.ts src/forge/remote-mcp-server.test.ts

      - name: Lint project
        run: npm run lint
