name: Forge bridge regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  forge-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application and generate typed route tree
        run: npm run build:dev

      - name: Type-check project
        run: npm run typecheck

      - name: Run Forge bridge and export regression tests
        run: node --experimental-strip-types --test src/forge/sdk/execute.test.ts
