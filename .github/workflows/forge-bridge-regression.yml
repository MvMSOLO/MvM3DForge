name: Forge bridge regression

on:
  push:
    branches: [main, 'task-**']
  pull_request:
    branches: [main, 'task-**']

jobs:
  forge-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app in development mode and generate typed route tree
        run: npm run build:dev

      - name: Type-check project
        run: npm run typecheck

      - name: Run complete unit test suite
        run: npm test

      - name: Build production bundle with Preview database policy
        run: VERCEL_ENV=preview npm run build

      - name: Verify live dev/build auth flag consistency
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/mvm3d-auth-invariant.log"
          setsid npm run dev > "$log_file" 2>&1 &
          server_pid=$!
          cleanup() {
            kill -- "-$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:8080/__app-env >/dev/null 2>&1; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$log_file"
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$log_file"
            exit 1
          fi
          npm run check:auth

      - name: Run MCP, auth and scene regression tests
        run: node --experimental-strip-types --test src/lib/auth/mcp-auth-policy.test.ts src/lib/auth/deployment-readiness.test.ts src/lib/database-readiness.test.ts src/lib/auth/email-password-flow.test.ts src/lib/auth/origin-policy.test.ts src/lib/mcp/oauth-config.test.ts src/lib/mcp/origin-policy.test.ts src/lib/mcp/api-keys.test.ts src/forge/sdk/execute.test.ts src/forge/ai-mcp.test.ts src/forge/export-glb.test.ts src/forge/remote-mcp-server.test.ts

      - name: Lint project
        run: npm run lint

      - name: Run sign-out sequence unit tests
        run: node --test scripts/sign-out-plan.test.mjs


  migration-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mvm3_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mvm3_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mvm3_migration_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate fresh PostgreSQL initialization, rerun safety, and data preservation
        run: node scripts/migration-postgres-smoke.mjs

      - name: Run migration inventory and retry-policy unit tests
        run: node --test scripts/migration-plan.test.mjs

      - name: Create isolated account-auth test database
        run: psql postgresql://postgres:postgres@localhost:5432/postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE mvm3_auth_test;"

      - name: Verify signup, valid sign-in, wrong-password rejection, and persisted sessions on PostgreSQL
        env:
          AUTH_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mvm3_auth_test
        run: npm run test:auth:postgres

      - name: Verify production auth fails closed without persistent database
        run: npm run test:auth:database-unavailable

  production-mcp-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4

      - name: Check production OAuth discovery and MCP authentication boundary
        run: node scripts/mcp-production-smoke.mjs
